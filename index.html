<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            color: black;
        }

        .page {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
            padding: 3.5vw;
            gap: 6vw;
        }

        /* LEFT SIDE */

        .image-section {
            background: black;
            min-height: 90vh;
            position: relative;
            overflow: hidden;
        }

        .image-text {
            position: absolute;
            left: 35px;
            top: 190px;
            color: white;
            font-size: 7vw;
            line-height: 0.95;
            font-weight: 400;
        }

        /* RIGHT SIDE */

        .content {
            padding-top: 10px;
            max-width: 600px;
        }

        h1 {
            font-size: 5vw;
            font-weight: 400;
            margin: 0 0 15px 0;
        }

        .intro {
            font-size: 3vw;
            line-height: 1.1;
            margin-bottom: 70px;
        }

        /* DROPDOWNS */

        details {
            margin-bottom: 55px;
        }

        summary {
            cursor: pointer;
            list-style: none;
            font-size: 3vw;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::before {
            content: "▼";
            font-size: 0.7em;
        }

        details[open] summary::before {
            transform: rotate(180deg);
        }

        .dropdown-text {
            font-size: 2.5vw;
            margin-left: 65px;
            margin-top: 15px;
        }

        /* PHONE */

        @media (max-width: 700px) {

            .page {
                display: block;
                padding: 20px;
            }

            .image-section {
                min-height: 500px;
                margin-bottom: 40px;
            }

            .image-text {
                font-size: 16vw;
                left: 20px;
                top: 150px;
            }

            h1 {
                font-size: 14vw;
            }

            .intro {
                font-size: 8vw;
                margin-bottom: 50px;
            }

            summary {
                font-size: 8vw;
            }

            .dropdown-text {
                font-size: 6vw;
                margin-left: 40px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <!-- LEFT -->
        <section class="image-section">
            <div class="image-text">
                image<br>
                floating on<br>
                the side
            </div>
        </section>


        <!-- RIGHT -->
        <section class="content">

            <h1>header</h1>

            <div class="intro">
                text text text text<br>
                [self introduction]
            </div>


            <details>
                <summary>dropdown 1</summary>
                <div class="dropdown-text">
                    dropdown text
                </div>
            </details>


            <details>
                <summary>dropdown 2</summary>
                <div class="dropdown-text">
                    dropdown text
                </div>
            </details>


            <details>
                <summary>dropdown 3</summary>
                <div class="dropdown-text">
                    dropdown text
                </div>
            </details>

        </section>

    </main>

</body>
</html>
