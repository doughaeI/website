<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>eighth dawn</title>

    <link rel="icon" type="image/png" href="img/icon.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            color: #7295bb;
            font-family: Georgia, "Times New Roman", serif;
        }

        /* THE WHOLE WEBSITE */

        .page {
            width: min(1100px, 92vw);
            min-height: 100vh;
            margin: 0 auto;

            display: grid;
            grid-template-columns: 52% 48%;
            align-items: center;
        }


        /* CHARACTER / IMAGE */

        .character {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .character img {
            width: 100%;
            max-width: 570px;
            max-height: 920px;
            object-fit: contain;
        }


        /* RIGHT SIDE */

        .content {
            padding: 40px 20px 40px 20px;
        }

        h1 {
            margin: 0 0 20px 0;

            font-size: 76px;
            line-height: 1;
            font-weight: bold;

            color: #7295bb;
        }

        .intro {
            font-size: 48px;
            line-height: 1.1;
            color: #a8c4e3;

            margin-bottom: 80px;
        }


        /* DROPDOWNS */

        details {
            margin-bottom: 55px;
        }

        summary {
            cursor: pointer;

            display: flex;
            align-items: center;
            gap: 18px;

            font-size: 50px;
            line-height: 1;

            color: #7295bb;

            list-style: none;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::before {
            content: "▼";
            font-family: Arial, sans-serif;
            font-size: 35px;
        }

        .dropdown-text {
            margin-top: 15px;
            margin-left: 80px;

            font-size: 43px;
            line-height: 1.1;

            color: #a8c4e3;
        }


        /* PHONE */

        @media (max-width: 750px) {

            .page {
                width: 90vw;
                display: block;
                padding: 30px 0;
            }

            .character img {
                width: 85%;
                max-height: 600px;
            }

            .content {
                padding: 30px 0;
            }

            h1 {
                font-size: 55px;
            }

            .intro {
                font-size: 32px;
                margin-bottom: 55px;
            }

            summary {
                font-size: 34px;
            }

            summary::before {
                font-size: 25px;
            }

            .dropdown-text {
                font-size: 29px;
                margin-left: 55px;
            }

            details {
                margin-bottom: 45px;
            }
        }
    </style>
</head>


<body>

    <main class="page">

        <!-- LEFT: YOUR CHARACTER -->

        <section class="character">

            <!-- Change "character.png" to the name of your image -->
            <img src="nendo.png" alt="sunny">

        </section>


        <!-- RIGHT: YOUR INFORMATION -->

        <section class="content">

            <h1>header</h1>

            <div class="intro">
                text text text text<br>
                [self introduction]
            </div>


            <details open>
                <summary>dropdown 1</summary>

                <div class="dropdown-text">
                    dropdown text
                </div>
            </details>


            <details open>
                <summary>dropdown 2</summary>

                <div class="dropdown-text">
                    dropdown text
                </div>
            </details>


            <details open>
                <summary>dropdown 3</summary>

                <div class="dropdown-text">
                    dropdown text
                </div>
            </details>

        </section>

    </main>

</body>
</html>
