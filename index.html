<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            color: #7295bb;
            font-family: Georgia, "Times New Roman", serif;
        }

        .page {
            width: min(850px, 90vw);
            min-height: 100vh;
            margin: 0 auto;

            display: grid;
            grid-template-columns: 50% 50%;
            align-items: center;
        }

        .character {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .character img {
            width: 85%;
            max-width: 400px;
            max-height: 700px;
            object-fit: contain;
        }

        .content {
            padding: 30px 10px;
        }

        h1 {
            margin: 0 0 12px 0;

            font-size: 52px;
            line-height: 1;
            font-weight: bold;

            color: #7295bb;
        }

        .intro {
            font-size: 30px;
            line-height: 1.1;
            color: #a8c4e3;

            margin-bottom: 55px;
        }

        details {
            margin-bottom: 35px;
        }

        summary {
            cursor: pointer;

            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 32px;
            line-height: 1;

            color: #7295bb;

            list-style: none;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::before {
            content: "▼";
            font-family: Arial, sans-serif;
            font-size: 22px;
        }

        .dropdown-text {
            margin-top: 10px;
            margin-left: 50px;

            font-size: 27px;
            line-height: 1.1;

            color: #a8c4e3;
        }

        @media (max-width: 650px) {

            .page {
                width: 90vw;
                display: block;
                padding: 25px 0;
            }

            .character img {
                width: 70%;
                max-height: 500px;
            }

            .content {
                padding: 25px 0;
            }

            h1 {
                font-size: 45px;
            }

            .intro {
                font-size: 27px;
                margin-bottom: 45px;
            }

            summary {
                font-size: 30px;
            }

            summary::before {
                font-size: 20px;
            }

            .dropdown-text {
                font-size: 25px;
                margin-left: 45px;
            }

            details {
                margin-bottom: 35px;
            }
        }
    </style>
</head>


<body>

    <main class="page">

        <section class="character">
            <img src="nendo.png" alt="Character">
        </section>

        <section class="content">

            <h1>header</h1>

            <div class="intro">
                text text text text<br>
                [self introduction]
            </div>

            <details>
                <summary>dropdown 1</summary>

                <div class="dropdown-text">
                    dropdown text
                </div>
            </details>

            <details>
                <summary>dropdown 2</summary>

                <div class="dropdown-text">
                    dropdown text
                </div>
            </details>

            <details>
                <summary>dropdown 3</summary>

                <div class="dropdown-text">
                    dropdown text
                </div>
            </details>

        </section>

    </main>

</body>
</html>
